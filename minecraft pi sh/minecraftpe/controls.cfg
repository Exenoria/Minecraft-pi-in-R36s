# Ajustes de Minecraft PE en la R36S. Las lineas con # son comentarios.
# Edita este archivo con cualquier editor de texto; no hace falta recompilar.

# --- Velocidad de la camara (stick derecho). Mas alto = gira mas rapido.
look_speed=900

# --- Velocidad del cursor en los menus (sticks).
cursor_speed=480

# --- Zona muerta de los sticks (0.05 a 0.5). Sube el valor si la camara "se va sola".
deadzone=0.20

# --- Intercambiar botones (1 = si, 0 = no).
# Si saltar/aceptar te queda en el boton equivocado, prueba swap_ab=1
swap_ab=0
# Intercambia X e Y (inventario).
swap_xy=0

# --- Distancia de dibujado: 0 = lejos, 1 = normal, 2 = corta, 3 = minima.
# Quitalo o ponlo en 2 si el juego va justo; baja a 3 si va a tirones.
view_distance=2
